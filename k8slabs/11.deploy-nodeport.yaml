apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploynodeport
spec:
  replicas: 4
  selector:
    matchLabels:
      app: deploynodeport
  template:
    metadata:
      labels:
        app: deploynodeport
        env: demo
        color: red
        proj: notifynodeport
    spec:
      containers:
      - name: deploynodeportcont
        image: nginxdemos/nginx-hello:0.3-plain-text
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: nodeportservice
spec:
  type: NodePort
  selector:
    # app: myapp
    color: red
    proj: notifynodeport
  ports:
  - port: 80 # exposed service clusterip:port
    targetPort: 8080 #container 
    nodePort: 30007
