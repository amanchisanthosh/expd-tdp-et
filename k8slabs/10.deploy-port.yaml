apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployport
spec:
  replicas: 4
  selector:
    matchLabels:
      app: deployport
  template:
    metadata:
      labels:
        app: deployport
        env: demo
        color: red
        proj: notifyport
    spec:
      containers:
      - name: deployportcont
        image: nginxdemos/nginx-hello:0.3-plain-text
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: portservice
spec:
  selector:
    # app: myapp
    color: red
    proj: notifyport
  ports:
  - port: 80 # exposed service clusterip:port
    targetPort: 8080 #container 
