apiVersion: v1
kind: Pod
metadata:
  name: hostpod
  labels:
    app.kubernetes.io/name: hostpod
spec:
  nodeName: node2
  containers:
  - name: hostpod
    image: nginx
    resources:
      limits:
        memory: "128Mi"
        cpu: "500m"
    volumeMounts:
      - name: hostpath
        mountPath: /usr/share/nginx/html
    ports:
      - containerPort: 80
  volumes:
  - name: hostpath
    hostPath: 
      path: /webcontent
      type: DirectoryOrCreate
