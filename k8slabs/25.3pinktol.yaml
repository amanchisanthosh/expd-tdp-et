apiVersion: v1
kind: Pod
metadata:
  name: pinkpod
  labels:
    app.kubernetes.io/name: notolerancepod
spec:
  tolerations:
    - key: "color"
      operator: "Equal"
      value: "pink"
      # effect: "NoExecute"
  containers:
  - name: pinkpod
    image: nginx
    resources:
      limits:
        memory: "128Mi"
        cpu: "500m"
    ports:
      - containerPort: 80
