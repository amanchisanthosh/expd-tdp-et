apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployweb
spec:
  replicas: 4
  selector:
    matchLabels:
      app: deployweb
  template:
    metadata:
      labels:
        app: deployweb
        env: demo
        color: red
        proj: notify
    spec:
      containers:
      - name: deploywebcont
        image: nginxdemos/hello:0.3-plain-text
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: webservice
spec:
  selector:
    # app: myapp
    color: red
    proj: notify
  ports:
  - port: 80 # exposed service clusterip:port
    targetPort: 80 #container 
