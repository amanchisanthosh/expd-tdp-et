---
- name: Install httpd and firwalld
  yum:
    name:
      - httpd
      - firewalld
    state: present

- name: Create index page content
  copy:
    dest: /var/www/html/index.html
    content: "Nothing is free Lunch"
  notify: restart httpd

- name: Start and enable firewalld
  service:
    name: firewalld
    state: started
    enabled: true

- name: Allow HTTP service
  firewalld:
    service: http
    permanent: true
    immediate: true
    state: enabled

- name: Enable httpd
  service:
    name: httpd
    state: started
    enabled: true
