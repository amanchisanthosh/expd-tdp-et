---
# tasks file for webserver
- name: install httpd
  ansible.builtin.yum:
    name: httpd
    state: latest
- name: file creation
  ansible.builtin.file:
    path: /var/www/html/index.html
    state: touch
- name: shell command
  #ansible.builtin.shell: "echo This is Ansible generated webpage authored by SR> /var/www/html/index.html"
  ansible.builtin.shell: "echo Its a ansible_role!> /var/www/html/index.html"
  register: output
  notify:       
    - restart_apache    
